name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app_runtime:ci-runtime@localhost:5432/app
      MIGRATION_DATABASE_URL: postgres://app_owner:ci-owner@localhost:5432/app
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated CI roles
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U postgres -d app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_owner LOGIN PASSWORD 'ci-owner' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE app_runtime LOGIN PASSWORD 'ci-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          ALTER DATABASE app OWNER TO app_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO app_owner;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          SQL
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec tsx --conditions=react-server --test tests/identity/tenant-rls.test.ts
        env:
          IDENTITY_TEST_DATABASE: 1
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
