name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app_runtime:ci-runtime@localhost:5432/app
      MIGRATION_DATABASE_URL: postgres://app_owner:ci-owner@localhost:5432/app
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://site.example.test
      PUBLIC_APP_URL: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated CI roles
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U postgres -d app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_owner LOGIN PASSWORD 'ci-owner' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE app_runtime LOGIN PASSWORD 'ci-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          ALTER DATABASE app OWNER TO app_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO app_owner;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          SQL
      - run: pnpm db:migrate
      - run: pnpm exec tsx --conditions=react-server --test tests/identity/tenant-rls.test.ts
        env:
          IDENTITY_TEST_DATABASE: 1
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgres://app_runtime:ci-runtime@localhost:5432/app
      MIGRATION_DATABASE_URL: postgres://app_owner:ci-owner@localhost:5432/app
      NODE_ENV: production
      BETTER_AUTH_URL: http://127.0.0.1:3000
      # CI-only throwaway secret; never reuse outside this ephemeral job.
      BETTER_AUTH_SECRET: ci-e2e-only-secret-not-for-production-0123456789
      IDENTITY_PROFILE: hybrid
      ORGANIZATION_MODE: multi
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: "Vibe E2E <no-reply@example.test>"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      # Production build on HTTP loopback in CI only; never set this in a deployed environment.
      EMAIL_ALLOW_INSECURE_LOOPBACK: "true"
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://site.example.test
      PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated CI roles
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U postgres -d app -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_owner LOGIN PASSWORD 'ci-owner' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          CREATE ROLE app_runtime LOGIN PASSWORD 'ci-runtime' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          ALTER DATABASE app OWNER TO app_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO app_owner;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES FOR ROLE app_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          SQL
      - name: Generate personal panel and Note resource (exercises CLI output end to end)
        run: |
          pnpm vibe panel app --context personal --prefix /app --noninteractive
          pnpm vibe resource Note --model note --panel app --with-model --migration --noninteractive \
            --spec '{"scope":"personal","fields":{"title":{"type":"string","required":true},"body":{"type":"text","optional":true}},"permissions":{"read":["personal"],"create":["personal"],"update":["personal"],"delete":["personal"]}}'
      - run: pnpm db:migrate
      - run: pnpm --filter app build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_GENERATED_RESOURCE: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
